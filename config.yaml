# Kích thước khung hình chuẩn; box luôn tính theo ảnh sau resize.
scene:
  resize_width: 640
  resize_height: 480
  annotate_step: 5
  roi: null
  ignore_regions: []
  door_line: [320, 0, 320, 480]
detector:
  # Learning rate thấp giúp hạn chế MOG2 hấp thụ người đứng yên.
  history: 500
  varThreshold: 16.0
  learningRate: 0.001
  blur_kernel: 3
  opening_kernel: 3
  opening_iterations: 1
  closing_kernel: 5
  closing_iterations: 2
  dilation_kernel: 3
  dilation_iterations: 1
  min_area: 400
  max_area: 100000
  min_ratio: 1.2
  max_ratio: 5.0
  use_hog_baseline: false
tracker:
  # Lucas-Kanade: cửa sổ lớn hơn bù dịch nhiều pixel; pyramid giảm ảnh hưởng chuyển động vừa.
  winSize: [21, 21]
  maxLevel: 3
  criteria: [3, 30, 0.01]
  use_fb_check: true
  fb_thresh: 1.0
  min_points: 4
  max_corners: 100
  quality_level: 0.01
  min_distance: 5.0
  block_size: 7
  refresh_every: 5
  matcher: hungarian
  iou_gate: 0.1
  confirm_hits: 3
  max_misses: 10
  box_update_alpha: 0.2
  # IoU legacy vẫn dùng làm bằng chứng blob bổ sung.
  blob_iou: 0.2
  # Coverage tối thiểu của từng track để detection được xem là chứa track đó.
  blob_track_coverage: 0.75
  # Tâm hai track phải cách nhau ít nhất tỷ lệ này của đường chéo box nhỏ hơn.
  blob_center_separation: 0.35
  # Số frame tối đa giữ track sau khi blob cuối cùng được xác nhận.
  blob_grace_frames: 35
  # Histogram HSV H-S dùng 16 bins cho Hue và 16 bins cho Saturation.
  hist_bins: [16, 16]
  # Tương quan histogram tối thiểu để cho phép phục hồi ID sau khi blob tách.
  hist_corr_min: 0.7
events:
  crossing_margin: 5
features:
  orb_nfeatures: 500
  sift_nfeatures: 500
reid:
  match_threshold: 0.7
benchmark:
  warmup_frames: 10

metrics:
  # Một cặp chỉ khớp nếu IoU lớn hơn hoặc bằng ngưỡng này.
  iou_threshold: 0.5
  mostly_tracked_ratio: 0.8
